
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عضویت در باشگاه مشتریان ROMISTAY</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 35px 15px;
      background: #f8f6f0;
      color: #10243a;
      font-family: 'Vazirmatn', sans-serif;
      min-height: 100vh;
    }

    .club-page {
      max-width: 850px;
      margin: 35px auto;
      padding: 45px;
      background: linear-gradient(145deg, #ffffff, #fdfbf6);
      border: 1px solid rgba(201, 164, 92, 0.55);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(16, 36, 58, 0.08);
    }

    .club-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .club-heading span {
      color: #b28b45;
      font-size: 12px;
      letter-spacing: 3px;
      font-weight: 700;
    }

    .club-heading h1 {
      color: #10243a;
      font-size: 27px;
      margin: 15px 0;
    }

    .club-heading p {
      color: #78818b;
      font-size: 14px;
      line-height: 2;
    }

    .club-field {
      margin-bottom: 22px;
    }

    .club-field label {
      display: block;
      color: #10243a;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    .club-field input {
      width: 100%;
      padding: 15px 17px;
      border: 1px solid #ded6c8;
      border-radius: 12px;
      background: #fff;
      color: #10243a;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .club-field input:focus {
      border-color: #c9a45c;
      box-shadow: 0 0 0 3px rgba(201, 164, 92, 0.12);
    }

    .club-submit {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #c9a45c, #a98238);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .club-note {
      text-align: center;
      color: #858585;
      font-size: 12px;
      margin-top: 20px;
      line-height: 2;
    }

    .club-back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #a98238;
      text-decoration: none;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .club-page {
        margin: 15px auto;
        padding: 28px 20px;
      }

      .club-heading h1 {
        font-size: 22px;
      }
    }
/* کارت عضویت باشگاه مشتریان ROMISTAY */
.member-card {
  display: none;
  position: relative;
  max-width: 460px;
  margin: 35px auto;
  padding: 30px;
  overflow: hidden;
  border-radius: 24px;
  color: #fff;
  background: linear-gradient(135deg, #10243a, #1c3852);
  border: 1px solid #d6b477;
  box-shadow: 0 18px 40px rgba(16, 36, 58, 0.18);
  direction: rtl;
}

.member-card::before {
  content: "";
  position: absolute;
  width: 190px;
  height: 190px;
  left: -65px;
  top: -75px;
  border: 1px solid rgba(214, 180, 119, 0.35);
  border-radius: 50%;
}

.member-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(214, 180, 119, 0.45);
  padding-bottom: 18px;
}

.member-card-logo {
  color: #e5c58d;
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 2px;
}

.member-card-label {
  color: #f0d9ad;
  font-size: 13px;
}

.member-card-title {
  color: #e5c58d;
  font-size: 20px;
  margin: 25px 0 18px;
}

.member-card-info {
  line-height: 2.2;
  font-size: 14px;
}

.member-card-info strong {
  color: #f0d9ad;
}

.member-card-number {
  margin-top: 22px;
  padding: 13px;
  text-align: center;
  border: 1px solid rgba(214, 180, 119, 0.5);
  border-radius: 12px;
  color: #f0d9ad;
  font-size: 18px;
  font-weight: 800;
}
  </style>
</head>

<body>

  <main class="club-page">

    <div class="club-heading">
      <span>JOIN THE CLUB</span>
      <h1>به خانواده ROMISTAY بپیوندید</h1>
      <p>عضویت رایگان است؛ سفرهای جذاب‌تری در انتظار شماست.</p>
    </div>
    <form id="club-membership-form">

      <div class="club-field">
        <label for="club-name">نام و نام خانوادگی</label>
        <input type="text" id="club-name" name="name"
          placeholder="نام کامل خود را وارد کنید" required>
      </div>

      <div class="club-field">
        <label for="club-mobile">شماره موبایل</label>
        <input type="tel" id="club-mobile" name="mobile"
          placeholder="مثلاً 09123456789" required>
      </div>

      <div class="club-field">
        <label for="club-city">شهر محل سکونت</label>
        <input type="text" id="club-city" name="city"
          placeholder="نام شهر خود را وارد کنید" required>
      </div>

      <button type="submit" class="club-submit">
        ثبت درخواست عضویت رایگان
      </button>

      <p class="club-note">
        عضویت در باشگاه مشتریان ROMISTAY کاملاً رایگان است.
      </p>

    </form>

    <a href="index.html" class="club-back">
      بازگشت به صفحه اصلی ROMISTAY
    </a>

  </main>

  

<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwiFWd0iiJjtjba9YHCSnRVHKiPEQ8xvgPonnQjxFCzvTCS4N0RamwfUDkgRsppBNaXUA/exec';

  document.getElementById('club-membership-form').addEventListener('submit', async function(event) {
    event.preventDefault();

    const form = this;
    const button = form.querySelector('button[type="submit"]');
    const originalText = button.textContent;

    const data = {
      name: form.querySelector('[name="name"]').value.trim(),
      mobile: form.querySelector('[name="mobile"]').value.trim(),
      city: form.querySelector('[name="city"]').value.trim()
    };

    button.disabled = true;
    button.textContent = 'در حال ثبت اطلاعات...';

    try {
      await fetch(scriptURL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(data)
      });

      alert(
        'درخواست عضویت شما ارسال شد! 🎉\n\n' +
        'به خانواده ROMISTAY خوش آمدید ❤️'
      );

      form.reset();

    } catch (error) {
      alert('ارسال درخواست با مشکل مواجه شد. لطفاً دوباره تلاش کنید.');
    } finally {
      button.disabled = false;
      button.textContent = originalText;
    }
  });
</script>


</body>
</html>
